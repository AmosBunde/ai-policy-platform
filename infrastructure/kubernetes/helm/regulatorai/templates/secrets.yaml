apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    {{- include "regulatorai.labels" . | nindent 4 }}
type: Opaque
stringData:
  # All values are required — installs fail loudly rather than shipping
  # forgeable defaults. Provide them via --set/--set-file, a values file kept
  # out of git, or an external secrets operator.
  DATABASE_URL: {{ required "externalSecrets.databaseUrl is required (postgresql+asyncpg://user:pass@host:5432/db)" .Values.externalSecrets.databaseUrl | quote }}
  REDIS_URL: {{ required "externalSecrets.redisUrl is required (redis://:pass@host:6379/0)" .Values.externalSecrets.redisUrl | quote }}
  ELASTICSEARCH_URL: {{ required "externalSecrets.elasticsearchUrl is required (http://elastic:pass@host:9200)" .Values.externalSecrets.elasticsearchUrl | quote }}
  JWT_SECRET: {{ required "externalSecrets.jwtSecret is required (openssl rand -hex 32)" .Values.externalSecrets.jwtSecret | quote }}
  INTERNAL_SERVICE_TOKEN: {{ required "externalSecrets.internalServiceToken is required (openssl rand -hex 32)" .Values.externalSecrets.internalServiceToken | quote }}
  OPENAI_API_KEY: {{ required "externalSecrets.openaiApiKey is required" .Values.externalSecrets.openaiApiKey | quote }}
