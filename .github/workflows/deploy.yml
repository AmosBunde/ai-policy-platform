name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # GHCR image names must be lowercase; github.repository is mixed-case
  IMAGE_PREFIX: ghcr.io/amosbunde/ai-policy-platform

jobs:
  publish:
    name: Build & push (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gateway-service
            context: .
            dockerfile: services/gateway-service/Dockerfile
          - image: ingestion-service
            context: .
            dockerfile: services/ingestion-service/Dockerfile
          - image: agent-service
            context: .
            dockerfile: services/agent-service/Dockerfile
          - image: compliance-service
            context: .
            dockerfile: services/compliance-service/Dockerfile
          - image: search-service
            context: .
            dockerfile: services/search-service/Dockerfile
          - image: notification-service
            context: .
            dockerfile: services/notification-service/Dockerfile
          - image: dashboard
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  image-scan:
    name: Scan published gateway image
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/gateway-service:sha-${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif

  deploy-production:
    name: Helm deploy (gated)
    runs-on: ubuntu-latest
    needs: [publish, image-scan]
    # Protect the `production` environment in repo settings with required
    # reviewers to make this a manual-approval gate. The job is skipped
    # entirely until the DEPLOY_ENABLED repo variable is set to 'true' and
    # a KUBE_CONFIG secret is configured.
    if: vars.DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.2
      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Helm upgrade
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INTERNAL_SERVICE_TOKEN: ${{ secrets.INTERNAL_SERVICE_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          ELASTICSEARCH_URL: ${{ secrets.ELASTICSEARCH_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # The chart composes images as <svc>.image.repository:<svc>.image.tag,
          # so point every service at the images this run just published.
          IMAGE_SETS=""
          for svc in gateway ingestion agent compliance search notification; do
            IMAGE_SETS="$IMAGE_SETS --set-string ${svc}.image.repository=${IMAGE_PREFIX}/${svc}-service"
            IMAGE_SETS="$IMAGE_SETS --set-string ${svc}.image.tag=sha-${GITHUB_SHA}"
          done
          IMAGE_SETS="$IMAGE_SETS --set-string dashboard.image.repository=${IMAGE_PREFIX}/dashboard"
          IMAGE_SETS="$IMAGE_SETS --set-string dashboard.image.tag=sha-${GITHUB_SHA}"

          helm upgrade --install regulatorai \
            infrastructure/kubernetes/helm/regulatorai \
            --namespace regulatorai --create-namespace \
            -f infrastructure/kubernetes/helm/regulatorai/values-prod.yaml \
            $IMAGE_SETS \
            --set externalSecrets.jwtSecret="$JWT_SECRET" \
            --set externalSecrets.internalServiceToken="$INTERNAL_SERVICE_TOKEN" \
            --set externalSecrets.databaseUrl="$DATABASE_URL" \
            --set externalSecrets.redisUrl="$REDIS_URL" \
            --set externalSecrets.elasticsearchUrl="$ELASTICSEARCH_URL" \
            --set externalSecrets.openaiApiKey="$OPENAI_API_KEY" \
            --atomic --timeout 10m
