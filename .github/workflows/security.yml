name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly sweep, Monday 06:00 UTC
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  bandit:
    name: Bandit (blocking at medium+ severity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit
      # -ll: fail only on medium/high severity (currently clean); low-severity
      # findings are surfaced in the full report below without failing the build
      - run: bandit -c .bandit.yml -r services shared -ll
      - name: Full report (informational)
        if: always()
        run: bandit -c .bandit.yml -r services shared -q || true

  trivy-fs:
    name: Trivy filesystem & config scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vulnerability scan (report to code scanning)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
      - name: Fail on CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          skip-setup-trivy: true

  npm-audit:
    name: npm audit (report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
