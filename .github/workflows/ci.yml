name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-critical:
    name: Lint (blocking — real errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      # Syntax errors, undefined names, broken f-strings — always blocking
      - run: ruff check --select E9,F63,F7,F82 services shared

  lint-full:
    name: Lint (report-only — full style)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      # ~130 pre-existing style violations; ratchet this to blocking after cleanup
      - run: ruff check services shared
      - run: ruff format --check services shared

  backend-tests:
    name: Backend tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway-service
          - ingestion-service
          - agent-service
          - compliance-service
          - search-service
          - notification-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      # WeasyPrint (compliance) renders PDFs via system Pango/GDK libraries
      - name: Install system dependencies
        if: matrix.service == 'compliance-service'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libgdk-pixbuf-2.0-0
      - name: Install requirements
        run: pip install -r services/${{ matrix.service }}/requirements.txt
      - name: Run tests
        working-directory: services/${{ matrix.service }}
        env:
          PYTHONPATH: ${{ github.workspace }}:.
        run: python -m pytest tests -q

  shared-tests:
    name: Shared utils tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/gateway-service/requirements.txt
      - run: pip install -r services/gateway-service/requirements.txt
      - name: Run shared tests
        env:
          PYTHONPATH: .
        run: python -m pytest shared -q

  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx vite build

  docker-build:
    name: Docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gateway-service
            context: .
            dockerfile: services/gateway-service/Dockerfile
          - image: ingestion-service
            context: .
            dockerfile: services/ingestion-service/Dockerfile
          - image: agent-service
            context: .
            dockerfile: services/agent-service/Dockerfile
          - image: compliance-service
            context: .
            dockerfile: services/compliance-service/Dockerfile
          - image: search-service
            context: .
            dockerfile: services/search-service/Dockerfile
          - image: notification-service
            context: .
            dockerfile: services/notification-service/Dockerfile
          - image: dashboard
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
