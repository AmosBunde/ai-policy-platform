name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-critical:
    name: Lint (blocking — real errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      # Syntax errors, undefined names, broken f-strings — always blocking
      - run: ruff check --select E9,F63,F7,F82 services shared

  lint-full:
    name: Lint (blocking — full style)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      # Codebase is fully clean (see ruff.toml); keep it that way
      - run: ruff check --output-format=github services shared
      - run: ruff format --check services shared

  mypy:
    name: Type check (shared blocking; services report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/gateway-service/requirements.txt
      - run: |
          pip install -r services/gateway-service/requirements.txt
          pip install mypy types-requests types-redis
      # shared/ and gateway are mypy-clean today — blocking
      - name: mypy shared (blocking)
        run: mypy --ignore-missing-imports shared
      - name: mypy gateway (blocking)
        working-directory: services/gateway-service
        env:
          MYPYPATH: ${{ github.workspace }}
        run: mypy --ignore-missing-imports src
      # ~15 known errors across the other services — burn-down tracked in #87
      - name: mypy remaining services (report-only)
        run: |
          for s in ingestion agent compliance search notification; do
            echo "== $s-service =="
            (cd "services/$s-service" && MYPYPATH="$GITHUB_WORKSPACE" mypy --ignore-missing-imports src) || true
          done

  backend-tests:
    name: Backend tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway-service
          - ingestion-service
          - agent-service
          - compliance-service
          - search-service
          - notification-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt
      # WeasyPrint (compliance) renders PDFs via system Pango/GDK libraries
      - name: Install system dependencies
        if: matrix.service == 'compliance-service'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libgdk-pixbuf-2.0-0
      - name: Install requirements
        run: |
          pip install -r services/${{ matrix.service }}/requirements.txt
          pip install pytest pytest-asyncio httpx
      - name: Run tests
        working-directory: services/${{ matrix.service }}
        env:
          PYTHONPATH: ${{ github.workspace }}:.
        run: python -m pytest tests -q

  shared-tests:
    name: Shared utils tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/gateway-service/requirements.txt
      - run: |
          pip install -r services/gateway-service/requirements.txt
          pip install pytest pytest-asyncio httpx
      - name: Run shared tests
        env:
          PYTHONPATH: .
        run: python -m pytest shared -q

  migrations:
    name: DB migrations (upgrade, drift check, roundtrip, seed)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: regulatorai
          POSTGRES_USER: regulatorai
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U regulatorai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: regulatorai
      POSTGRES_USER: regulatorai
      POSTGRES_PASSWORD: ci_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/gateway-service/requirements.txt
      - run: pip install -r services/gateway-service/requirements.txt
      - name: Upgrade to head
        working-directory: services/gateway-service
        env:
          PYTHONPATH: ${{ github.workspace }}:.
        run: python -m alembic upgrade head
      - name: Drift check (models vs migrations)
        working-directory: services/gateway-service
        env:
          PYTHONPATH: ${{ github.workspace }}:.
        run: python -m alembic check
      - name: Downgrade/upgrade roundtrip
        working-directory: services/gateway-service
        env:
          PYTHONPATH: ${{ github.workspace }}:.
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head
      - name: Seed against migrated schema
        env:
          PYTHONPATH: ${{ github.workspace }}
          SEED_ADMIN_PASSWORD: ci-only-Password1
        run: python -m scripts.seed_data

  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx vite build

  docker-build:
    name: Docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: gateway-service
            context: .
            dockerfile: services/gateway-service/Dockerfile
          - image: ingestion-service
            context: .
            dockerfile: services/ingestion-service/Dockerfile
          - image: agent-service
            context: .
            dockerfile: services/agent-service/Dockerfile
          - image: compliance-service
            context: .
            dockerfile: services/compliance-service/Dockerfile
          - image: search-service
            context: .
            dockerfile: services/search-service/Dockerfile
          - image: notification-service
            context: .
            dockerfile: services/notification-service/Dockerfile
          - image: dashboard
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
